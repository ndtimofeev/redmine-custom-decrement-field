ru:
  error_custom_decrement_field_exhausted: "Значение уже равно нулю (или меньше), списание недоступно"
  error_custom_decrement_field_duplicate_literal: "Это списание уже было записано ранее - повторный запрос проигнорирован"
  notice_custom_decrement_field_decremented: "Декрементировано"
  button_custom_decrement_field_decrement: "Декрементировать"

  label_decrementable_int: "Декрементируемое целое число"
  label_custom_decrement_field_inconsistent: "История декрементируемого поля неконсистентна"
  text_custom_decrement_field_inconsistent_title: "История декрементируемого поля этой задачи выглядит неконсистентной — вероятно, кто-то отредактировал или удалил комментарий напрямую, в обход кнопки списания."
  text_custom_decrement_field_inconsistent_negative: "Текущее значение %{value} — меньше нуля, а это возможно только если комментарий со списанием был отредактирован или задублирован вручную."
  text_custom_decrement_field_inconsistent_duplicate: "Одно и то же списание (%{literal}) было записано более одного раза"
  text_custom_decrement_field_inconsistent_marker: "История этого поля неконсистентна — подробности в плашке над задачей"
  field_increment_token: "Ключевое слово прихода"
  field_decrement_token: "Ключевое слово списания"
  field_zero_status_id: "Статус при обнулении"
  text_increment_token_hint: "Слово, которым записывается приход материала, например «PRIHOD : 10» добавляет десять. Под ним же записывается начальное количество, введённое при создании задачи."
  text_decrement_token_hint: "Слово, которым записывается списание, например «RASHOD : 1» списывает единицу. Число всегда пишется положительным: направление задаёт слово, а знак перед числом игнорируется. Необязательное слово после числа (буквы, цифры, - . _ ~) — разовая ссылка, по которой распознаётся повторный запрос. Оба слова обязательны и должны различаться; выбирайте то, что нормально читается, — они видны в истории комментариев."
  error_custom_decrement_field_same_tokens: "Слово прихода и слово списания должны различаться."
  text_zero_status_id_hint: "Необязательно. Оставьте пустым, если статус не нужно менять автоматически."
  text_decrementable_int_readonly_hint: "Значение вычисляется по истории комментариев к задаче и не редактируется здесь напрямую. Используйте кнопку списания на карточке задачи, либо отредактируйте/удалите соответствующий комментарий, чтобы исправить ошибку."
  text_decrementable_int_initial_hint: "Для этого поля ещё не записано ни одного количества, поэтому текущее количество можно ввести здесь. Оно сохранится как первая запись истории поля; дальше значение меняется только комментариями и кнопкой списания."

  label_watchdog: "Наблюдатель (критический уровень)"
  label_decrement_sum: "Взвешенная сумма дочерних"
  field_watched_field: "Наблюдаемое поле"
  text_watched_field_hint: "Тикет подсвечивается, когда наблюдаемое поле становится меньше или равно значению этого поля. Оба поля должны быть привязаны к одному трекеру."
  field_source_field: "Поле дочерних для суммирования"
  field_multiplier_token: "Токен множителя"
  text_multiplier_token_hint: "Необязательно, например PACK. Комментарий к этому тикету вида «PACK : #57 : 0,5 бутылка 0,5 л» задаёт множитель 0,5 на единицу для дочернего #57; всё после числа — заметка для кладовщика, система её игнорирует. Не упомянутые дочерние считаются с множителем 1."
  text_sum_readonly_hint: "Вычисляется по дочерним тикетам и не редактируется."
