en:
  error_custom_decrement_field_exhausted: "Value is already zero (or less), decrement is unavailable"
  error_custom_decrement_field_duplicate_literal: "This exact decrement was already recorded - ignoring the duplicate request"
  notice_custom_decrement_field_decremented: "Decremented"
  button_custom_decrement_field_decrement: "Decrement"

  label_decrementable_int: "Decrementable integer"
  label_custom_decrement_field_inconsistent: "Decrement field is inconsistent"
  text_custom_decrement_field_inconsistent_title: "Something is wrong with this issue's fields:"
  text_custom_decrement_field_inconsistent_negative: "Current value is %{value}, which is below zero - this can only happen if a comment recording a decrement was edited or duplicated by hand."
  text_custom_decrement_field_inconsistent_duplicate: "The same decrement (%{literal}) was recorded more than once"
  text_custom_decrement_field_inconsistent_marker: "Something is wrong with this field - see the notice above the issue for details"
  text_custom_decrement_field_zero_status_status_missing: "The amount has run out, but the status configured for this field no longer exists, so there is nowhere to move the issue. Fix the field's setting."
  text_custom_decrement_field_zero_status_problem: "The amount has run out, but the issue was not moved to status \"%{status}\": %{reason}"
  text_custom_decrement_field_watchdog_problem: "The watchdog has triggered, but the issue was not moved to status \"%{status}\": %{reason}"
  text_custom_decrement_field_watchdog_status_missing: "The watchdog has triggered, but the status configured for it no longer exists, so there is nowhere to move the issue. Fix the field's setting."
  text_custom_decrement_field_blocker_not_in_workflow: "that status is not in the workflow of the \"%{tracker}\" tracker. Add it to the workflow or change the field's setting."
  text_custom_decrement_field_blocker_not_closable: "an issue with open subtasks or a blocking issue cannot be closed."
  text_custom_decrement_field_blocker_not_reopenable: "it is a subtask of a closed issue and cannot be reopened."
  field_trigger_status_id: "Status when triggered"
  text_trigger_status_id_hint: "Optional. The issue is moved to this status at the moment the watched field drops to the critical level or below - once, not on every save. Leave blank to not change the status."
  field_increment_token: "Add keyword"
  field_decrement_token: "Write-off keyword"
  field_zero_status_id: "Status on reaching zero"
  text_increment_token_hint: "Keyword for adding material, e.g. \"PRIHOD : 10\" adds ten. Also what the initial amount typed on a new issue is recorded under."
  text_decrement_token_hint: "Keyword for writing material off, e.g. \"RASHOD : 1\" writes one off. The number is always written positive - the keyword decides the direction, and a sign typed in front of it is ignored. An optional word after the number (letters, digits, - . _ ~) is a one-off reference used to recognise a duplicate request. Both keywords are required and must differ; pick words that read naturally, since they show up in the comment history."
  error_custom_decrement_field_same_tokens: "The add keyword and the write-off keyword must be different words."
  text_zero_status_id_hint: "Optional. Leave blank to not change the issue's status automatically."
  text_status_setting_missing: "Selected status no longer exists (id %{id}) - issues are not moved to it. Pick another status or clear this one."
  text_status_setting_not_in_workflow: "Status \"%{status}\" is not in the workflow of: %{trackers}. Issues of these trackers are not moved to it. Add the status to their workflow, or clear this setting."
  text_decrementable_int_readonly_hint: "This value is computed from the issue's comment history and can't be edited directly here. Use the decrement button on the issue, or edit/delete the relevant comment to correct a mistake."
  text_decrementable_int_initial_hint: "No amount has been recorded for this field yet, so you can type the current amount here. It is saved as the field's first history entry; from then on the value changes only through comments and the decrement button."

  label_watchdog: "Watchdog (critical level)"
  label_decrement_sum: "Weighted sum of children"
  field_watched_field: "Watched field"
  text_watched_field_hint: "The ticket is highlighted once the watched field is at or below this field's value. Both fields must be attached to the same tracker."
  field_source_field: "Children's field to sum"
  field_multiplier_token: "Multiplier token"
  text_multiplier_token_hint: "Optional, e.g. PACK. A comment on this ticket like \"PACK : #57 : 0.5 bottle 0.5 l\" makes child #57 count 0.5 per unit; whatever follows the number is a note for the storekeeper and is ignored. Children not mentioned count 1."
  text_sum_readonly_hint: "Computed from the child tickets and not editable."
